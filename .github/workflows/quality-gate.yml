name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Browser acceptance dependencies
        shell: powershell
        run: |
          $browserRoot = Join-Path $env:RUNNER_TEMP "takara-browser"
          npm install --prefix $browserRoot --no-package-lock --ignore-scripts playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $browserRoot "node_modules/playwright/cli.js") install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TAKARA_PLAYWRIGHT_MODULE=$browserRoot/node_modules/playwright" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run Takara Quality Gate
        shell: powershell
        env:
          TAKARA_QUALITY_REPORT_ROOT: ${{ runner.temp }}\takara-quality-reports
          TAKARA_3D_REPORT_DIR: ${{ runner.temp }}\takara-quality-reports\browser-3d
        run: .\tools\takara_quality_gate.ps1 -Mode prepush

      - name: Upload Quality Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: takara-quality-gate-report
          path: ${{ runner.temp }}\takara-quality-reports
          if-no-files-found: warn
          retention-days: 14
