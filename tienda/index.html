<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="googlebot" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/takara-store-public.css">
</head>
<body class="takara-store-channel">
  <main
    class="takara-store-shell"
    data-takara-store-app
    data-store-endpoint=""
    data-state="loading"
    aria-busy="true"
  >
    <section
      class="takara-store-state takara-store-state--loading"
      data-store-loading
      role="status"
      aria-live="polite"
      aria-atomic="true"
    >
      <p class="takara-store-kicker">Pedido de tienda</p>
      <h1>Abriendo tienda…</h1>
      <p>Estamos verificando el establecimiento asociado a este enlace.</p>
    </section>

    <section
      class="takara-store-order"
      data-store-active
      aria-labelledby="takara-store-active-title"
      hidden
    >
      <header class="takara-store-identity">
        <p>Pedido en</p>
        <h1 id="takara-store-active-title" data-store-name></h1>
      </header>
      <iframe
        class="takara-store-order-frame"
        data-store-order-frame
        title="Pedido"
        referrerpolicy="no-referrer"
        scrolling="no"
        hidden
      ></iframe>
    </section>

    <section
      class="takara-store-state takara-store-state--error"
      data-store-error
      hidden
      role="alert"
      aria-labelledby="takara-store-error-title"
    >
      <p class="takara-store-kicker">Enlace no disponible</p>
      <h1 id="takara-store-error-title">No podemos abrir esta tienda.</h1>
      <p data-store-error-message>
        Revisa el QR o solicita un enlace válido al establecimiento.
      </p>
    </section>

    <noscript>
      <section class="takara-store-state takara-store-state--error" role="alert">
        <p class="takara-store-kicker">JavaScript necesario</p>
        <h1>No podemos verificar esta tienda.</h1>
        <p>
          Este canal necesita JavaScript para comprobar el establecimiento.
          No continuaremos sin una atribución Store válida.
        </p>
      </section>
    </noscript>
  </main>

  <script src="../assets/js/takara-config.js?v=precio-central-v1"></script>
  <script src="../assets/js/takara-store-public.js"></script>
</body>
</html>
